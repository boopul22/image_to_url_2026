<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1200px; height: 675px; font-family: "Space Grotesk", system-ui, sans-serif; }
    #card {
      width: 1200px; height: 675px; padding: 48px 56px;
      background: #fafafa; border: 1px solid #e5e5e5;
    }
    .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #e11d48; }
    h1 { font-size: 36px; font-weight: 800; margin: 10px 0 24px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e5e5e5; }
    th, td { border-top: 1px solid #e5e5e5; padding: 16px 14px; text-align: left; font-size: 15px; }
    th { background: #1a1a1a; color: #fff; font-weight: 800; border-top: none; }
    td.yes { color: #e11d48; font-weight: 800; }
    tr:nth-child(even) td { background: #fafafa; }
  </style>
</head>
<body>
  <div id="card">
    <div class="eyebrow">{{eyebrow}}</div>
    <h1>{{title}}</h1>
    <table>
      <thead>
        <tr><th>Feature</th><th>{{colA}}</th><th>{{colB}}</th></tr>
      </thead>
      <tbody>
        <tr><td>{{r1l}}</td><td class="yes">{{r1a}}</td><td>{{r1b}}</td></tr>
        <tr><td>{{r2l}}</td><td class="yes">{{r2a}}</td><td>{{r2b}}</td></tr>
        <tr><td>{{r3l}}</td><td class="yes">{{r3a}}</td><td>{{r3b}}</td></tr>
        <tr><td>{{r4l}}</td><td class="yes">{{r4a}}</td><td>{{r4b}}</td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>
