<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1200px; height: 675px; font-family: "Space Grotesk", ui-monospace, system-ui, sans-serif; }
    #card {
      width: 1200px; height: 675px; padding: 48px 56px;
      background: #111; color: #f5f5f5; border: 1px solid #333;
    }
    .eyebrow { color: #fb7185; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
    h1 { font-size: 34px; font-weight: 800; margin: 12px 0 24px; font-family: "Space Grotesk", system-ui, sans-serif; }
    pre {
      background: #1a1a1a; border: 1px solid #333; padding: 24px;
      font-size: 18px; line-height: 1.5; overflow: hidden; white-space: pre-wrap;
    }
    .hi { color: #fb7185; }
  </style>
</head>
<body>
  <div id="card">
    <div class="eyebrow">{{eyebrow}}</div>
    <h1>{{title}}</h1>
    <pre>{{code}}</pre>
  </div>
</body>
</html>
