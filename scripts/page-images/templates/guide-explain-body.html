<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1200px; height: 675px; font-family: "Space Grotesk", system-ui, sans-serif; }
    #card {
      width: 1200px; height: 675px; padding: 48px 56px;
      background: #fff; border: 1px solid #e5e5e5;
    }
    h1 { font-size: 34px; font-weight: 800; margin-bottom: 24px; }
    ul { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    li {
      border: 1px solid #e5e5e5; background: #fafafa; padding: 16px 18px;
      font-size: 17px; font-weight: 600; display: flex; gap: 12px; align-items: flex-start;
    }
    .mark { color: #e11d48; font-weight: 800; }
  </style>
</head>
<body>
  <div id="card">
    <h1>{{title}}</h1>
    <ul>
      <li><span class="mark">1</span><span>{{i1}}</span></li>
      <li><span class="mark">2</span><span>{{i2}}</span></li>
      <li><span class="mark">3</span><span>{{i3}}</span></li>
      <li><span class="mark">4</span><span>{{i4}}</span></li>
    </ul>
  </div>
</body>
</html>
