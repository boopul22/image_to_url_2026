<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1200px; height: 675px; font-family: "Space Grotesk", system-ui, sans-serif; }
    #card {
      width: 1200px; height: 675px; padding: 48px 56px;
      background: #fafafa; border: 1px solid #e5e5e5;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #e11d48; }
    h1 { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; margin: 12px 0 28px; max-width: 920px; }
    .drop {
      border: 2px dashed #cfcfcf; background: #fff; height: 260px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    }
    .badge {
      display: inline-block; background: #ffe4e9; color: #9f1239; border: 1px solid #fecdd3;
      padding: 8px 12px; font-size: 13px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
    }
    .drop strong { font-size: 22px; }
    .drop span { color: #666; font-size: 15px; }
    .foot { display: flex; justify-content: space-between; color: #666; font-size: 14px; border-top: 1px solid #e5e5e5; padding-top: 16px; }
  </style>
</head>
<body>
  <div id="card">
    <div>
      <div class="eyebrow">{{eyebrow}}</div>
      <h1>{{title}}</h1>
      <div class="drop">
        <div class="badge">{{badge}}</div>
        <strong>{{dropTitle}}</strong>
        <span>{{dropSub}}</span>
      </div>
    </div>
    <div class="foot"><span>imagetourl.cloud</span><span>{{primaryKeyword}}</span></div>
  </div>
</body>
</html>
