<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1200px; height: 675px; font-family: "Space Grotesk", system-ui, sans-serif; }
    #card {
      width: 1200px; height: 675px; padding: 48px 56px;
      background: #fff; border: 1px solid #e5e5e5;
      display: flex; flex-direction: column; justify-content: center; gap: 24px;
    }
    h1 { font-size: 34px; font-weight: 800; }
    .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .step { border: 1px solid #e5e5e5; background: #fafafa; padding: 22px; min-height: 180px; }
    .n { width: 32px; height: 32px; background: #e11d48; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; margin-bottom: 12px; }
    h2 { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
    p { color: #555; font-size: 15px; line-height: 1.4; }
  </style>
</head>
<body>
  <div id="card">
    <h1>{{title}}</h1>
    <div class="row">
      <div class="step"><div class="n">1</div><h2>{{s1}}</h2><p>{{s1b}}</p></div>
      <div class="step"><div class="n">2</div><h2>{{s2}}</h2><p>{{s2b}}</p></div>
      <div class="step"><div class="n">3</div><h2>{{s3}}</h2><p>{{s3b}}</p></div>
    </div>
  </div>
</body>
</html>
