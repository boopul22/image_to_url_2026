<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1200px; height: 675px; font-family: ui-monospace, "Space Grotesk", system-ui, sans-serif; }
    #card {
      width: 1200px; height: 675px; padding: 48px 56px;
      background: #111; color: #f5f5f5; border: 1px solid #333;
    }
    h1 { font-family: "Space Grotesk", system-ui, sans-serif; font-size: 32px; font-weight: 800; margin-bottom: 20px; }
    pre {
      background: #1a1a1a; border: 1px solid #333; padding: 24px;
      font-size: 18px; line-height: 1.55; white-space: pre-wrap;
    }
    .hi { color: #fb7185; }
  </style>
</head>
<body>
  <div id="card">
    <h1>{{title}}</h1>
    <pre>{{code}}</pre>
  </div>
</body>
</html>
