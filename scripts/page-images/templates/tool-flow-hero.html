<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 675px;
      font-family: "Space Grotesk", "DM Sans", system-ui, sans-serif;
      background: #f7f7f7;
      color: #1a1a1a;
    }
    #card {
      width: 1200px;
      height: 675px;
      padding: 48px 56px;
      background: #fafafa;
      border: 1px solid #e5e5e5;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .eyebrow {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #e11d48;
    }
    h1 {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      max-width: 900px;
      margin-top: 12px;
    }
    .steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 36px;
    }
    .step {
      background: #fff;
      border: 1px solid #e5e5e5;
      padding: 20px;
      min-height: 160px;
    }
    .num {
      width: 36px;
      height: 36px;
      background: #e11d48;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .step h2 {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .step p {
      font-size: 15px;
      color: #555;
      line-height: 1.4;
    }
    .chip {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 10px;
      border: 1px solid #e5e5e5;
      background: #f3f3f3;
      font-family: ui-monospace, monospace;
      font-size: 13px;
    }
    .foot {
      font-size: 14px;
      color: #666;
      border-top: 1px solid #e5e5e5;
      padding-top: 16px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div id="card">
    <div>
      <div class="eyebrow">{{eyebrow}}</div>
      <h1>{{title}}</h1>
      <div class="steps">
        <div class="step">
          <div class="num">1</div>
          <h2>{{step1Title}}</h2>
          <p>{{step1Body}}</p>
          <div class="chip">{{fileLabel}}</div>
        </div>
        <div class="step">
          <div class="num">2</div>
          <h2>{{step2Title}}</h2>
          <p>{{step2Body}}</p>
        </div>
        <div class="step">
          <div class="num">3</div>
          <h2>{{step3Title}}</h2>
          <p>{{step3Body}}</p>
        </div>
      </div>
    </div>
    <div class="foot">
      <span>imagetourl.cloud</span>
      <span>{{primaryKeyword}}</span>
    </div>
  </div>
</body>
</html>
